name: netops

services:
  postgres:
    image: postgres:18
    container_name: netops-postgres
    environment:
      POSTGRES_USER: netops
      POSTGRES_PASSWORD: netops
      POSTGRES_DB: netops
    ports:
      - "15432:5432"
    volumes:
      - netops_pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netops -d netops"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  netops_pg:
